@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English:ital@0;1&display=swap');

.gm-root {
  --ink:#171019; --wood:#231826; --wood2:#2C2030;
  --parch:#E9DAB8; --parch2:#DCC896; --parch-ink:#2E2418;
  --gold:#C9A227; --gold2:#E4C557; --ox:#8E3B2F; --teal:#3E7C6F;
  min-height:100vh; background:
    radial-gradient(1200px 600px at 50% -10%, #33223A 0%, var(--ink) 60%),
    var(--ink);
  color:#E8DFD0; font-family:'Alegreya', Georgia, serif; padding-bottom:84px;
}
.gm-root * { box-sizing:border-box; }
h1,h2,h3 { font-family:'Cinzel', serif; letter-spacing:.04em; }
.h2 { font-size:22px; color:var(--gold2); margin:18px 0 4px; }
.h3 { font-size:14px; color:var(--parch2); margin:22px 0 8px; text-transform:uppercase; letter-spacing:.14em; }
.lede { color:#C7BBA8; font-size:15px; margin:0 0 14px; font-style:italic; font-family:'IM Fell English', serif; }
.content { max-width:760px; margin:0 auto; padding:12px 16px 40px; }

/* ---- banner & logo ---- */
.banner { display:flex; align-items:center; justify-content:center; gap:12px; padding:16px 16px 10px; }
.banner .logo { width:46px; height:46px; color:var(--gold); flex-shrink:0; }
.banner-title { font-family:'Cinzel', serif; font-weight:900; letter-spacing:.14em; font-size:clamp(17px, 4.6vw, 26px); color:var(--gold2); text-transform:uppercase; line-height:1.1; }
.banner-sub { font-family:'IM Fell English', serif; font-style:italic; font-size:12.5px; color:#B7A88F; }

/* ---- board header actions ---- */
.board-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.board-actions { display:flex; gap:8px; }
.board-actions .btn.tiny { margin:0; }

/* ---- profile ---- */
.profile-head { display:flex; align-items:center; gap:16px; margin:18px 0 6px; }
.ava-wrap { position:relative; flex-shrink:0; }
.ava { width:76px; height:76px; border-radius:50%; object-fit:cover; border:3px solid var(--gold); box-shadow:0 4px 14px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; }
.ava-empty { background:var(--wood2); color:var(--gold); font-size:28px; }
.ava-edit { position:absolute; bottom:-4px; left:50%; transform:translateX(-50%); background:var(--wood2); border:1px solid var(--gold); color:var(--gold2); font-family:'Cinzel',serif; font-size:9.5px; letter-spacing:.08em; padding:2px 9px; border-radius:99px; cursor:pointer; }
.profile-id { flex:1; min-width:0; }
.gear { background:var(--wood); border:1px solid #4A3550; color:#B7A88F; width:42px; height:42px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.gear svg { width:22px; height:22px; }
.gear.on { border-color:var(--gold); color:var(--gold2); }
.settings label { display:block; font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-family:'Cinzel',serif; color:var(--parch2); }
.settings .field { margin-top:5px; font-family:'Alegreya',serif; text-transform:none; letter-spacing:normal; }
.set-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; }
select.field { appearance:none; }

/* ---- post-a-contract form ---- */
.form-row { margin:12px 0 4px; text-align:left; }
.form-label { display:block; font-family:'Cinzel',serif; font-size:11px; letter-spacing:.12em; color:rgba(30,17,5,.75); margin-bottom:6px; text-transform:uppercase; }
.pick-row { display:flex; gap:6px; flex-wrap:wrap; }
.stat-pick { display:flex; align-items:center; gap:5px; background:transparent; border:1px solid rgba(30,17,5,.4); color:rgba(30,17,5,.85); border-radius:999px; padding:4px 11px; font-family:'Cinzel',serif; font-weight:700; font-size:11.5px; cursor:pointer; }
.stat-pick svg { width:15px; height:15px; }
.stat-pick.on { border-color:#571E0C; background:rgba(87,30,12,.14); color:#3A1408; }
.stat-pick:disabled { opacity:.35; cursor:not-allowed; }
.wood-field { background:rgba(255,240,210,.55); border:1px solid rgba(30,17,5,.4); color:#241505; margin-top:10px; }
.wood-field::placeholder { color:rgba(36,21,5,.5); }

/* ---- employer's desk ---- */
.desk { padding:12px; }
.desk-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.desk-head .btn.tiny { margin-left:auto; }
.petition { display:flex; align-items:center; gap:10px; background:#1B1220; border:1px solid #3A2A40; border-radius:8px; padding:9px 11px; margin-top:9px; flex-wrap:wrap; }
.pet-meta { font-family:'Cinzel',serif; font-size:11px; color:var(--gold2); font-weight:700; margin-left:6px; white-space:nowrap; }
.pet-actions { display:flex; gap:0; margin-left:auto; }
.confirm-row { border-color:var(--teal); }
.mini-stars { display:flex; gap:2px; margin-left:auto; }
.mini-star { background:none; border:none; font-size:24px; color:#5A4A60; cursor:pointer; transition:color .1s, transform .1s; padding:0 2px; }
.mini-star:hover, .mini-star:hover ~ .mini-star { color:var(--gold); }
.mini-star:hover { transform:scale(1.15); }

/* ---- gate ---- */
.gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.gate-card { width:100%; max-width:420px; background:linear-gradient(180deg, var(--wood2), var(--wood)); border:1px solid #4A3550; border-radius:14px; padding:32px 28px; box-shadow:0 30px 80px rgba(0,0,0,.6); text-align:center; }
.crest { width:56px; height:56px; margin:0 auto 10px; border:2px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:24px; transform:rotate(0deg); }
.crest.small { width:36px; height:36px; font-size:16px; margin:0; }
.brand { font-size:26px; font-weight:900; color:var(--gold2); margin:0; }
.brand-sub { font-family:'IM Fell English', serif; font-style:italic; color:#B7A88F; margin:2px 0 18px; font-size:14px; }
.gate-copy { color:#D5C9B4; font-size:15px; line-height:1.55; }
.field-label { display:block; text-align:left; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--parch2); margin:14px 0 6px; }
.field { width:100%; background:#1B1220; border:1px solid #4A3550; border-radius:8px; padding:11px 12px; color:#EFE6D4; font-family:inherit; font-size:15px; }
.field:focus { outline:2px solid var(--gold); outline-offset:1px; }
.field.code { text-align:center; letter-spacing:.5em; font-size:22px; margin-top:14px; }
.check-row { display:flex; gap:8px; align-items:center; margin:12px 0 16px; font-size:14px; color:#D5C9B4; text-align:left; }
.fine { font-size:12px; color:#9A8D79; margin-top:16px; line-height:1.5; }

/* ---- buttons ---- */
.btn { font-family:'Cinzel', serif; font-weight:700; letter-spacing:.06em; border-radius:8px; padding:12px 18px; cursor:pointer; width:100%; margin-top:10px; border:1px solid transparent; font-size:14px; }
.btn.gold { background:linear-gradient(180deg, var(--gold2), var(--gold)); color:#221703; border-color:#8F7014; }
.btn.gold:disabled { filter:grayscale(.8) brightness(.6); cursor:not-allowed; }
.btn.ghost { background:transparent; color:var(--parch2); border-color:#4A3550; }
.btn.tiny { width:auto; padding:7px 12px; font-size:12px; margin:0 0 0 8px; background:var(--teal); color:#EAF4F0; border-color:#2C5B51; }
.btn.tiny.gold { background:linear-gradient(180deg, var(--gold2), var(--gold)); color:#221703; }
.btn.tiny.ghost { background:transparent; color:#B7A88F; border-color:#4A3550; }
.btn.tiny:disabled { opacity:.4; cursor:not-allowed; }

/* ---- topbar & tabs ---- */
.topbar { position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:rgba(23,16,25,.92); backdrop-filter:blur(6px); border-bottom:1px solid #3A2A40; }
.topbar-left { display:flex; gap:10px; align-items:center; background:none; border:none; cursor:pointer; padding:4px 8px 4px 0; border-radius:10px; text-align:left; }
.topbar-left:hover .tb-name, .topbar-left:focus-visible .tb-name { color:var(--gold2); }
.tb-name { font-family:'Cinzel', serif; font-weight:700; font-size:14px; color:var(--parch); }
.tb-sub { font-size:12px; color:#A79680; }
.topbar-right { display:flex; align-items:center; gap:10px; }
.scrip { font-size:13px; color:var(--gold2); font-weight:700; }
.tavern-dot { color:#5A4A60; font-size:14px; } .tavern-dot.in { color:#7BC96F; }
.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#1C1320; border-top:1px solid #3A2A40; z-index:30; }
.tab { flex:1; background:none; border:none; color:#8F7F92; padding:9px 0 10px; display:flex; flex-direction:column; gap:2px; align-items:center; font-family:'Cinzel', serif; font-size:10px; letter-spacing:.08em; cursor:pointer; }
.tab.on { color:var(--gold2); }
.tab svg { width:20px; height:20px; }

/* ---- tarot cards ---- */
.filters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.subtabs { display:flex; gap:8px; margin:6px 0 12px; }
.subtab { flex:1; background:transparent; border:1px solid #4A3550; color:#B7A88F; border-radius:8px; padding:9px 0; font-family:'Cinzel', serif; font-size:12px; letter-spacing:.1em; cursor:pointer; }
.subtab.on { border-color:var(--gold); color:var(--gold2); background:rgba(201,162,39,.08); }
.chip { background:transparent; border:1px solid #4A3550; color:#B7A88F; border-radius:999px; padding:4px 12px; font-family:'Cinzel', serif; font-size:12px; cursor:pointer; }
.chip.on { border-color:var(--gold); color:var(--gold2); }
.card-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(158px, 1fr)); gap:18px 14px; }
.tarot { position:relative; aspect-ratio:2.5/4; border:none; background:none; padding:0; cursor:pointer; text-align:center; container-type:inline-size; filter:drop-shadow(0 10px 16px rgba(0,0,0,.55)); }
.tarot:hover, .tarot:focus-visible { filter:drop-shadow(0 16px 24px rgba(0,0,0,.65)); }
.tarot::before { /* the dowel peg \u2014 fixed to the board wall, seen through the hole */ content:''; position:absolute; top:11px; left:calc(50% - 5px); width:10px; height:10px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #C69A5E, #8A6238 55%, #4A2E14 100%); box-shadow:0 1px 2px rgba(0,0,0,.65), inset 0 0 0 1.5px rgba(20,12,4,.65); z-index:4; }
.tarot-inner { position:relative; height:100%;
  clip-path:polygon(3% 0%, 97% 0%, 100% 2.2%, 100% 97.8%, 97% 100%, 3% 100%, 0% 97.8%, 0% 2.2%);
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160' preserveAspectRatio='none'><g fill='none' stroke='%23241203' stroke-opacity='.2'><path stroke-width='1.1' d='M12 -5 q4 45 -2 85 q-4 45 3 85'/><path stroke-width='.8' d='M24 -5 q-3 55 2 105 q2 35 -2 65'/><path stroke-width='1.2' d='M36 -5 q5 50 -1 95 q-3 40 2 75'/><path stroke-width='.9' d='M60 -5 q3 40 -2 90 q-3 45 2 80'/><path stroke-width='1.1' d='M84 -5 q-4 50 2 100 q3 35 -2 70'/><path stroke-width='.7' d='M93 -5 q3 55 -1 105 q-2 35 1 65'/><ellipse cx='72' cy='40' rx='3.5' ry='6.5' stroke-width='1'/><ellipse cx='72' cy='40' rx='7' ry='12' stroke-width='.8'/><path stroke-width='.8' d='M66 -5 q1 22 6 32 M78 -5 q-1 22 -6 32 M66 165 q2 -70 6 -113 M78 165 q-2 -70 -6 -113'/></g></svg>") center / 100% 100% no-repeat,
    linear-gradient(168deg, #A87E4B 0%, #8A6238 55%, #75512D 100%);
  box-shadow: inset 0 0 0 2.5px var(--rc), inset 0 0 0 6px rgba(30,17,5,.42), inset 0 3px 8px rgba(255,225,170,.16);
  color:#241505; display:flex; flex-direction:column; padding:26px 10px 10px;
  transform-origin:50% 16px; }
.tarot-inner::before { /* drilled hole the peg passes through */ content:''; position:absolute; top:8px; left:calc(50% - 8px); width:16px; height:16px; border-radius:50%; background:radial-gradient(circle at 42% 35%, #2A1808, #0C0602 65%); box-shadow: inset 0 2px 3px #000, 0 1px 0 rgba(255,225,170,.22), 0 0 0 2px rgba(30,17,5,.5); z-index:2; }
.tarot:hover .tarot-inner, .tarot:focus-visible .tarot-inner { animation:pegSwing 1.1s ease-in-out; }
@keyframes pegSwing { 0% { rotate:0deg; } 22% { rotate:2.6deg; } 52% { rotate:-1.8deg; } 78% { rotate:.9deg; } 100% { rotate:0deg; } }
.tarot:focus-visible { outline:2px solid var(--gold); outline-offset:3px; border-radius:12px; }
.tarot-top { display:flex; justify-content:space-between; font-family:'Cinzel', serif; font-size:11px; font-size:clamp(9.5px, 7cqw, 13px); font-weight:700; color:rgba(30,17,5,.72); }
.tarot-rank { font-size:14px; font-size:clamp(12px, 9cqw, 18px); font-weight:900; text-shadow:0 1px 0 rgba(255,225,170,.35); }
.tarot-art { flex:1; display:flex; align-items:center; justify-content:center; gap:4%; margin:6px 0; padding:0 4%; border-top:1px solid rgba(30,17,5,.35); border-bottom:1px solid rgba(30,17,5,.35); }
.tarot-stat { flex:1 1 0; min-width:0; max-width:34%; display:flex; flex-direction:column; align-items:center; gap:1px; }
.tarot-stat svg { width:100%; max-width:46px; height:auto; color:rgba(30,17,5,.8); }
.tarot-stat em { font-style:normal; font-family:'Cinzel',serif; font-weight:700; font-size:8.5px; font-size:clamp(7px, 5.5cqw, 10px); letter-spacing:.12em; color:rgba(30,17,5,.75); white-space:nowrap; }
.tarot-mine { position:absolute; top:-6px; left:-4px; background:var(--gold); color:#221703; font-size:10px; font-family:'Cinzel',serif; font-weight:700; padding:2px 8px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.4); z-index:3; }
.tarot-inner.barter { background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160' preserveAspectRatio='none'><g fill='none' stroke='%23141A05' stroke-opacity='.22'><path stroke-width='1.1' d='M12 -5 q4 45 -2 85 q-4 45 3 85'/><path stroke-width='.8' d='M24 -5 q-3 55 2 105 q2 35 -2 65'/><path stroke-width='1.2' d='M36 -5 q5 50 -1 95 q-3 40 2 75'/><path stroke-width='.9' d='M60 -5 q3 40 -2 90 q-3 45 2 80'/><path stroke-width='1.1' d='M84 -5 q-4 50 2 100 q3 35 -2 70'/><ellipse cx='72' cy='40' rx='3.5' ry='6.5' stroke-width='1'/><ellipse cx='72' cy='40' rx='7' ry='12' stroke-width='.8'/></g></svg>") center / 100% 100% no-repeat,
    linear-gradient(168deg, #8F955C 0%, #737A41 55%, #646B36 100%); }
.tarot-inner.barter .tarot-reward { color:#17301E; }
.tarot-inner.barter, .tarot-inner.barter .tarot-top, .tarot-inner.barter .tarot-type { color:#181F0C; }
.tarot-inner.barter .tarot-stat svg, .tarot-inner.barter .tarot-stat em { color:rgba(22,28,10,.82); }
.tarot-title { font-family:'Cinzel', serif; font-weight:700; font-size:12.5px; font-size:clamp(11px, 8cqw, 16px); line-height:1.25; min-height:32px; color:#1E1104; }
.tarot-type { font-family:'IM Fell English', serif; font-style:italic; font-size:11px; font-size:clamp(9.5px, 6.5cqw, 13px); color:rgba(30,17,5,.7); margin-top:2px; }
.tarot-reward { font-family:'Cinzel', serif; font-weight:700; font-size:12px; font-size:clamp(10px, 7.5cqw, 14.5px); color:#571E0C; margin-top:4px; }
.tarot-saved { position:absolute; top:-6px; right:-4px; background:var(--teal); color:#EAF4F0; font-size:10px; font-family:'Cinzel',serif; padding:2px 8px; border-radius:999px; box-shadow:0 2px 6px rgba(0,0,0,.4); z-index:3; }
.tarot.locked .tarot-inner { filter:grayscale(.45) brightness(.68); }
.tarot.locked:hover .tarot-inner, .tarot.locked:focus-visible .tarot-inner { animation:none; }
.tarot-chains { position:absolute; inset:0; z-index:3; pointer-events:none; filter:drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
.tarot-chains svg { width:100%; height:100%; display:block; }

/* ---- rows, panels, lists ---- */
.panel { background:var(--wood); border:1px solid #4A3550; border-radius:10px; padding:14px; margin:10px 0; font-size:14px; }
.quest-row { display:flex; align-items:center; gap:10px; background:var(--wood); border:1px solid #3A2A40; border-radius:10px; padding:10px 12px; margin:8px 0; }
.quest-row.inparty { border-color:var(--teal); }
.qr-rank { width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-weight:900; font-size:13px; color:#171019; flex-shrink:0; }
.qr-main { flex:1; min-width:0; }
.qr-title { font-weight:700; font-size:14px; color:var(--parch); }
.qr-sub { font-size:12.5px; color:#A79680; }
.empty { font-family:'IM Fell English',serif; font-style:italic; color:#7E6F5C; font-size:14px; }
.bucket { margin-bottom:6px; }

/* ---- character sheet ---- */
.sheet-head { display:flex; gap:16px; align-items:center; }
.rank-seal { width:64px; height:64px; border:3px solid; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Cinzel',serif; font-size:30px; font-weight:900; flex-shrink:0; }
.xpbar { height:8px; background:#171019; border-radius:99px; margin:8px 0 4px; overflow:hidden; border:1px solid #4A3550; }
.xpfill { height:100%; background:linear-gradient(90deg, var(--gold), var(--gold2)); }
.stat-row { display:none; }
/* MvC2-style attribute select */
.mvc-wrap { display:flex; gap:14px; align-items:stretch; margin-top:10px; }
.mvc-grid { display:grid; grid-template-columns:repeat(3, 76px); grid-auto-rows:76px; gap:8px; align-content:start; }
.mvc-tile { position:relative; background:linear-gradient(160deg,#2C2030 0%,#171019 80%); border:3px solid var(--tc); border-radius:4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--parch); transition:transform .1s ease; }
.mvc-tile:hover { transform:scale(1.06); z-index:2; }
.mvc-tile.sel { outline:3px solid var(--gold2); outline-offset:2px; animation:mvcPulse .8s infinite alternate; }
@keyframes mvcPulse { from { box-shadow:0 0 4px var(--gold2); } to { box-shadow:0 0 18px var(--gold2); } }
.mvc-ico svg { width:18px; height:18px; color:var(--tc); opacity:.9; }
.mvc-abbr { font-family:'Cinzel',serif; font-weight:900; font-size:12px; color:var(--tc); letter-spacing:.08em; }
.mvc-val { font-family:'Cinzel',serif; font-weight:900; font-size:24px; line-height:1; font-variant-numeric:tabular-nums; }
.mvc-detail { flex:1; min-width:150px; background:var(--wood); border:1px solid var(--tc); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; justify-content:center; }
.mvc-big { font-family:'Cinzel',serif; font-weight:900; font-size:46px; line-height:1; color:var(--tc); font-variant-numeric:tabular-nums; }
.mvc-dname { font-family:'Cinzel',serif; font-weight:700; font-size:16px; margin-top:4px; color:var(--parch); display:flex; align-items:center; gap:8px; }
.mvc-dico svg { width:20px; height:20px; color:var(--tc); }
.mvc-tier { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--tc); margin:2px 0 6px; }
.mvc-lore { font-family:'IM Fell English',serif; font-style:italic; font-size:13.5px; color:#B7A88F; margin:0; }
@media (prefers-reduced-motion: reduce) { .mvc-tile.sel { animation:none; } }
@media (max-width:520px) { .mvc-wrap { flex-direction:column; } .mvc-grid { grid-template-columns:repeat(3, 1fr); } }
.ach-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; }
.ach { display:flex; gap:10px; align-items:center; background:var(--wood); border:1px solid #3A2A40; border-radius:10px; padding:10px; opacity:.38; font-size:13px; }
.ach.got { opacity:1; border-color:var(--gold); }
.ach-ico { font-size:22px; }

/* ---- tavern ---- */
.locked-panel { text-align:center; padding:32px 20px; }
.big-lock { font-size:40px; margin-bottom:8px; }
.perk-list { list-style:none; padding:6px 0 0; margin:0; color:#C7BBA8; font-size:13.5px; line-height:1.9; }

/* ---- hall ---- */
.composer { display:flex; gap:8px; margin:10px 0 4px; }
.composer .field { flex:1; }
.bubble { background:#1B1220; border:1px solid #3A2A40; border-radius:12px 12px 12px 3px; padding:9px 12px; margin:8px 0; font-size:14px; max-width:85%; }
.bubble.me { margin-left:auto; border-radius:12px 12px 3px 12px; background:#213A34; border-color:var(--teal); }

/* ---- modals & toast ---- */
.overlay { position:fixed; inset:0; background:rgba(10,6,12,.78); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; animation:overlayIn .2s ease; }
@keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
.modal { width:100%; max-width:420px; max-height:88vh; overflow-y:auto; color:#241505; padding:24px 22px; border:none;
  clip-path:polygon(2.5% 0%, 97.5% 0%, 100% 2%, 100% 98%, 97.5% 100%, 2.5% 100%, 0% 98%, 0% 2%);
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 160' preserveAspectRatio='none'><g fill='none' stroke='%23241203' stroke-opacity='.16'><path stroke-width='1' d='M12 -5 q4 45 -2 85 q-4 45 3 85'/><path stroke-width='.7' d='M30 -5 q-3 55 2 105 q2 35 -2 65'/><path stroke-width='1.1' d='M52 -5 q5 50 -1 95 q-3 40 2 75'/><path stroke-width='.8' d='M74 -5 q3 40 -2 90 q-3 45 2 80'/><path stroke-width='1' d='M90 -5 q-4 50 2 100 q3 35 -2 70'/></g></svg>") center / 100% 100% no-repeat,
    linear-gradient(168deg, #B0854F 0%, #8A6238 100%);
  box-shadow: inset 0 0 0 3px #4A2E14, inset 0 0 0 7px rgba(30,17,5,.32);
  animation:modalZoom .3s cubic-bezier(.2,.85,.3,1.15); }
@keyframes modalZoom { from { transform:scale(.55) translateY(40px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
@media (prefers-reduced-motion: reduce) { .modal { animation:none; } .overlay { animation:none; } }
.modal-rank { font-family:'Cinzel',serif; font-weight:900; font-size:12px; letter-spacing:.16em; }
.modal-title { font-family:'Cinzel',serif; font-size:19px; margin:6px 0 8px; color:#1E1104; }
.modal-desc { font-family:'IM Fell English',serif; font-style:italic; font-size:15px; line-height:1.5; color:#3E2A16; }
.modal-meta { font-size:13.5px; line-height:1.8; margin:10px 0; border-top:1px solid rgba(30,17,5,.3); padding-top:10px; }
.modal-meta b { font-family:'Cinzel',serif; font-size:11px; letter-spacing:.1em; margin-right:6px; color:rgba(30,17,5,.7); }
.warn { color:#571E0C; font-weight:700; }
.modal-actions { display:flex; gap:10px; }
.modal-actions .btn { margin-top:10px; }
.modal .btn.ghost { color:#3E2A16; border-color:rgba(30,17,5,.45); }
.tb-ava { width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); }
.tb-id { display:flex; flex-direction:column; align-items:flex-start; }
.stars { display:flex; justify-content:center; gap:6px; margin-top:14px; }
.star { font-size:34px; background:none; border:none; cursor:pointer; color:#8a7a5e; transition:color .1s, transform .1s; }
.star:hover { color:var(--gold); transform:scale(1.15); }
.toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:99; background:var(--wood2); border:1px solid var(--gold); color:var(--parch); padding:10px 18px; border-radius:99px; font-size:13.5px; box-shadow:0 10px 30px rgba(0,0,0,.6); max-width:90vw; text-align:center; }
.gains { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; z-index:98; pointer-events:none; }
.gain-chip { display:flex; align-items:center; gap:7px; background:var(--wood2); border:2px solid var(--gold); color:var(--parch); font-family:'Cinzel',serif; font-size:16px; letter-spacing:.06em; padding:9px 20px; border-radius:99px; box-shadow:0 0 24px rgba(201,162,39,.35), 0 10px 30px rgba(0,0,0,.6); opacity:0; animation:gainRise 2.2s ease-out forwards; }
.gain-chip b { color:var(--gold2); }
.gain-chip svg { width:20px; height:20px; color:var(--gold2); }
@keyframes gainRise { 0% { opacity:0; transform:translateY(26px) scale(.85); } 15% { opacity:1; transform:translateY(0) scale(1.05); } 25% { transform:translateY(0) scale(1); } 75% { opacity:1; } 100% { opacity:0; transform:translateY(-40px); } }
@media (prefers-reduced-motion: reduce) { .gain-chip { animation:gainFade 2.2s ease forwards; } }
@keyframes gainFade { 0% { opacity:0; } 15% { opacity:1; } 80% { opacity:1; } 100% { opacity:0; } }

@media (prefers-reduced-motion: reduce) { .tarot-inner, .star { transition:none !important; } }
@media (max-width:480px) { .card-grid { grid-template-columns:repeat(2, 1fr); } .stat-name { width:78px; } }
